name: Release
description: Runs the release script of this repository

inputs:
  command:
    description: prepare or finalize
    required: true
  version:
    description: Version increment or explicit version, for prepare
    default: ''
  token:
    description: Token for the pull request or the release
    required: true
  setup:
    description: Commands to run before the release script, like installing the dependencies or building
    default: ''

runs:
  using: composite
  steps:
    - id: pnpm
      run: |
        if [[ -f package.json ]] && jq -e '.devEngines.packageManager // .packageManager' package.json > /dev/null; then
          echo 'version=' >> "$GITHUB_OUTPUT"
        else
          echo 'version=latest' >> "$GITHUB_OUTPUT"
        fi
      shell: bash
    - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        version: ${{ steps.pnpm.outputs.version }}
        runtime: deno
    - if: inputs.setup != ''
      run: ${{ inputs.setup }}
      shell: bash
    - run: |
        root=$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)
        args=("$COMMAND")
        if [[ -n "$VERSION" ]]; then args+=("$VERSION"); fi
        deno run -A --no-config --lock "$root/deno.lock" --frozen "$root/scripts/release.ts" "${args[@]}"
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.token }}
