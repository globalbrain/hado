name: Wait
description: Waits for the runs of other workflows on the current commit and fails unless all of them succeed

inputs:
  workflows:
    description: The workflow files to wait for, the ones that don't exist are skipped
    default: test.yaml test.yml ci.yaml ci.yml

runs:
  using: composite
  steps:
    - run: |
        found=false
        for workflow in $WORKFLOWS; do
          gh api "repos/$GH_REPO/contents/.github/workflows/$workflow?ref=$GITHUB_SHA" --silent 2> /dev/null || continue
          found=true
          for _ in {1..12}; do
            runs=$(gh run list --workflow "$workflow" --commit "$GITHUB_SHA" --json databaseId --jq '.[].databaseId')
            if [[ -n "$runs" ]]; then break; fi
            sleep 5
          done
          if [[ -z "$runs" ]]; then
            echo "::error::$workflow has no run for $GITHUB_SHA"
            exit 1
          fi
          for run in $runs; do
            gh run watch "$run" --exit-status --compact --interval 10
          done
        done
        if [[ $found == false ]]; then
          echo "::error::None of the workflows exist: $WORKFLOWS"
          exit 1
        fi
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        WORKFLOWS: ${{ inputs.workflows }}
