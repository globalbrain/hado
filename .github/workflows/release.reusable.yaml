name: Release

on:
  workflow_call:
    inputs:
      version:
        description: Version increment or explicit version, used on workflow_dispatch
        type: string
      setup:
        description: Commands to run before preparing the release, like installing the dependencies or building
        type: string
        default: deno install
      publish:
        description: Commands to run after the release is created, like publishing the package
        type: string
        default: deno publish
      environment:
        description: Environment of the job that creates the release and publishes
        type: string
      environment_url:
        description: URL of the deployment to the environment, {0} is replaced with the version
        type: string
      workflows:
        description: Workflow files whose runs have to succeed before the release, the ones that don't exist are skipped
        type: string
        default: test.yaml test.yml ci.yaml ci.yml
    secrets:
      token:
        description: PAT to use instead of the default token
        required: false
    outputs:
      released:
        description: Whether this run created a release
        value: ${{ jobs.check.outputs.released }}
      version:
        description: The released version
        value: ${{ jobs.check.outputs.version }}
      tag:
        description: The released tag
        value: ${{ jobs.check.outputs.tag }}

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.token || github.token }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: $/.github/actions/release
        with:
          command: prepare
          version: ${{ inputs.version }}
          setup: ${{ inputs.setup }}
          token: ${{ secrets.token || github.token }}

  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      released: ${{ steps.check.outputs.released }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [[ -f deno.json ]]; then manifest=deno.json; else manifest=package.json; fi
          version=$(jq -r .version "$manifest")
          tagged=$(git ls-remote --tags origin "refs/tags/v$version" "refs/tags/v$version^{}" | tail -n 1 | cut -f 1)
          if [[ -n "$tagged" && "$tagged" != "$GITHUB_SHA" ]]; then
            echo "v$version is already tagged at ${tagged:0:7}, nothing to release"
            released=false
          else
            released=true
          fi
          printf 'version=%s\ntag=v%s\nreleased=%s\n' "$version" "$version" "$released" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.released == 'true'
        uses: $/.github/actions/wait
        with:
          workflows: ${{ inputs.workflows }}

  release:
    needs: check
    if: needs.check.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ format(inputs.environment_url, needs.check.outputs.version) }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.token || github.token }}
      - uses: $/.github/actions/release
        with:
          command: finalize
          token: ${{ secrets.token || github.token }}
      - if: inputs.publish != ''
        run: ${{ inputs.publish }}
